# SecureScan AI — production-oriented Docker Compose stack
# Usage: cp .env.docker .env && docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: securescan-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securescan}
      MYSQL_USER: ${MYSQL_USER:-securescan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-securescan_pass}
    # Host port 3307 avoids conflict with a local MySQL on 3306
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - securescan-net

  redis:
    image: redis:7-alpine
    container_name: securescan-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - securescan-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: securescan-backend:latest
    container_name: securescan-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      FLASK_APP: app:create_app
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://securescan:securescan_pass@mysql:3306/securescan}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REPORTS_STORAGE_PATH: /app/storage/reports
    ports:
      - "5000:5000"
    volumes:
      - backend_reports:/app/storage/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - securescan-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: securescan-frontend:latest
    container_name: securescan-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - securescan-net

volumes:
  mysql_data:
    name: securescan_mysql_data
  backend_reports:
    name: securescan_backend_reports

networks:
  securescan-net:
    driver: bridge
